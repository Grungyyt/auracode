name: build-exe

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifie version package.json = tag
        shell: pwsh
        run: |
          $pkg = (Get-Content cli/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($pkg -ne $tag) { Write-Error "package.json ($pkg) ≠ tag (${{ github.ref_name }}). Aligne la version avant de tagger."; exit 1 }
      - run: node scripts/build-exe.js
      - name: Vérifie le .exe (refuse un binaire non fusionné)
        shell: pwsh
        run: |
          $o = & .\cli\dist\auracode.exe --help
          if ($o -notmatch "AuraCode") { throw "exe invalide : blob non fusionné" }
      - name: Publie la release (idempotent : crée ou remplace l'asset)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "cli/dist/auracode.exe"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title $tag --generate-notes
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
